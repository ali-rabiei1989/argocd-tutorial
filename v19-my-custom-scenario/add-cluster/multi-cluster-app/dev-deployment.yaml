apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-test
  namespace: argo-app
spec:
  selector:
    matchLabels:
      app: dev-test
  template:
    metadata:
      labels:
        app: dev-test

    spec:
      containers:
      - name: dev-test
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
