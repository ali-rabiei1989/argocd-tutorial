# argocd-manager-on-cluster-two.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: argo-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: argo-app
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: argo-app
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: argo-app