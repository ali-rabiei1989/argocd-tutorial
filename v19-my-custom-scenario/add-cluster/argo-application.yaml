---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-argo-app
spec:
  project: default
  source:
    repoURL: https://github.com/ali-rabiei1989/argocd-tutorial.git
    targetRevision: tutorial
    path: v19-my-custom-scenario/add-cluster/multi-cluster-app
  destination:
    server: https://192.168.255.1:64430
    namespace: argo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=false