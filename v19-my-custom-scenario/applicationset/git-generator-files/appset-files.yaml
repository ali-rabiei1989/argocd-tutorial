---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-gen-files-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - git:
        repoURL: https://github.com/ali-rabiei1989/argocd-tutorial.git
        revision: tutorial
        files:
          - path: v19-my-custom-scenario/applicationset/git-generator-files/nginx/**/config.yaml
  template:
    metadata:
      name: '{{ .app.name }}-nginx-app'
      namespace: argocd
      annotations:
        notifications.argoproj.io/subscribe.mm-on-deployed.mattermost: "p4xonjwxzbfmxq44fmnzbwra9a"
        notifications.argoproj.io/subscribe.mm-on-sync-failed.mattermost: "p4xonjwxzbfmxq44fmnzbwra9a"
    spec:
      project: '{{ .app.project }}'
      source:
        repoURL: https://github.com/ali-rabiei1989/argocd-tutorial.git
        targetRevision: '{{ .app.branch }}'
        path: '{{ .app.path }}'
        directory:
          recurse: true
      destination:
        server: '{{ .app.cluster }}'
        namespace: '{{ .app.ns }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Validate=false
          - CreateNamespace=true
