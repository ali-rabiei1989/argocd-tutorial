---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-by-list
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - cluster_name: prod
            cluster_address: https://kubernetes.default.svc
            branch: main
          - cluster_name: dev
            cluster_address: https://192.168.255.1:64430 
            branch: tutorial
  template:
    metadata:
      name: '{{.cluster_name}}-app'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/ali-rabiei1989/argocd-tutorial.git
        targetRevision: '{{.branch}}'
        path: v03-argocd-applications/directoryOfmanifests
      destination:
        server: '{{.cluster_address}}'
        namespace: app-set
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Validate=false
          - CreateNamespace=true    