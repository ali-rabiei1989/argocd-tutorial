apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-from-scratch2
spec:
  destination:
    namespace: helm
    server: https://kubernetes.default.svc
  project: project-source-restriction
  source:
  # It's possible to override helm values through different ways such as "valueFiles", "values", "valuesObject" and "parameters". 
  # Values injections have the following order of precedence parameters > valuesObject > values > valueFiles > helm repository values.yaml Or rather
    helm:
      releaseName: my-helm-app
#      valueFiles:
#        - custom-values.yaml
          #      values: |
          #        replicaCount: 3
          #      valuesObject:
          #        replicaCount: 5
          #      parameters:
          #        - name: "replicaCount"
          #          value: "1"
    path: v03-argocd-applications/helm/nginx
    repoURL: https://github.com/ali-rabiei1989/argocd-tutorial.git
    targetRevision: main
